<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeChat - Home</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
    body { background: #000000; color: white; font-family: -apple-system, sans-serif; text-align: center; padding: 50px 20px; }
    .home-card { background: #121212; border: 1px solid #262626; padding: 4px; border-radius: 15px; max-width: 400px; margin: auto; padding: 30px; }
    h1 { font-size: 28px; margin-bottom: 30px; letter-spacing: -1px; }
    button { width: 100%; padding: 14px; margin-top: 15px; border: none; border-radius: 10px; background: #0095f6; color: white; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    button.sec { background: #262626; border: 1px solid #363636; }
</style>
</head>
<body>
<div class="home-card">
    <h1>💬 CodeChat Pro</h1>
    <button onclick="location.href='search.html'"><i data-lucide="search"></i> 🔍 Search Users</button>
    <button class="sec" onclick="location.href='profile.html'"><i data-lucide="user"></i> 👤 My Profile</button>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
