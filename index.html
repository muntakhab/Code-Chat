<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeChat Pro - Premium Edition</title>
<!-- Lucide Icons Library -->
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
    --bg-main: #000000;
    --bg-side: #121212;
    --bg-surface: #1e1e1e;
    --accent: #3797f0;
    --text-main: #f5f5f5;
    --text-muted: #737373;
    --border: #262626;
    --success: #0095f6;
    --danger: #ed4956;
}

* {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background: var(--bg-main);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    overflow: hidden;
}

/* App Container */
.app-container {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* Sidebar & Settings Navigation */
.sidebar {
    width: 320px;
    background: var(--bg-side);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px;
}

.brand-logo {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 30px;
    letter-spacing: -0.5px;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 10px;
}

/* My Profile Section inside Sidebar */
.my-profile-card {
    background: var(--bg-main);
    padding: 15px;
    border-radius: 16px;
    border: 1px solid var(--border);
    margin-bottom: 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
}

.profile-pic-container {
    position: relative;
    cursor: pointer;
    margin-bottom: 10px;
}

.my-avatar {
    width: 75px; height: 75px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--accent);
}

.edit-pic-overlay {
    position: absolute; bottom: 0; right: 0;
    background: var(--accent);
    padding: 6px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
}

/* System Tabs (Chat, Follow, Settings) */
.nav-tabs {
    display: flex; flex-direction: column; gap: 8px; flex: 1;
}

.tab-btn {
    display: flex; align-items: center; gap: 15px;
    padding: 14px 18px; border-radius: 12px;
    color: var(--text-main); background: transparent;
    border: none; cursor: pointer; text-align: left;
    font-size: 15px; font-weight: 500; transition: 0.2s;
}

.tab-btn:hover, .tab-btn.active {
    background: var(--border);
}

/* Main Content Windows */
.content-window {
    flex: 1;
    display: none;
    flex-direction: column;
    background: var(--bg-main);
}

.content-window.active {
    display: flex;
}

/* Chat Screen UI */
.chat-header {
    padding: 15px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 15px;
}

.user-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: #262626; display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: var(--accent);
}

.chat-user-details { flex: 1; }
.chat-username { font-weight: 600; font-size: 16px; }
.chat-status { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

#messages {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 10px;
}

.message-wrapper { display: flex; flex-direction: column; max-width: 70%; position: relative; }
.myWrapper { margin-left: auto; align-items: flex-end; }
.otherWrapper { margin-right: auto; align-items: flex-start; }

.bubble {
    padding: 12px 18px; border-radius: 24px; font-size: 15px; line-height: 1.4;
    word-wrap: break-word; cursor: pointer; position: relative;
}
.myMessage .bubble { background: var(--accent); color: white; }
.otherMessage .bubble { background: var(--border); color: white; }

.heart-badge {
    position: absolute; bottom: -8px; right: 14px;
    background: #000; border: 1px solid var(--border);
    border-radius: 12px; padding: 2px 6px; font-size: 11px;
}

.msg-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; padding: 0 8px; }

/* Input Area */
.input-container { padding: 20px; background: var(--bg-main); }
.input-area {
    display: flex; align-items: center; padding: 6px 12px 6px 20px;
    border: 1px solid var(--border); border-radius: 30px; gap: 15px;
}
.input-area input {
    flex: 1; padding: 10px 0; border: none; background: transparent;
    color: white; outline: none; font-size: 15px;
}
.input-area button {
    padding: 10px 20px; border: none; background: transparent;
    color: var(--accent); font-weight: 600; font-size: 15px; cursor: pointer;
}

/* Follow System UI Panel */
.panel-header { padding: 24px; border-bottom: 1px solid var(--border); font-size: 20px; font-weight: 700; }
.panel-body { padding: 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }

.section-title { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.user-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-side); padding: 15px; border-radius: 14px; border: 1px solid var(--border);
}
.user-row-info { display: flex; align-items: center; gap: 12px; }

/* Modern Interaction Buttons */
.btn-primary { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
.btn-success { background: var(--success); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; margin-right: 5px; }
.btn-danger { background: var(--danger); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
.btn-secondary { background: var(--border); color: var(--text-main); border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }

/* Settings Form elements */
.settings-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.settings-group label { font-size: 14px; color: var(--text-muted); }
.settings-group input, .settings-group select {
    background: var(--bg-side); border: 1px solid var(--border); color: white;
    padding: 12px; border-radius: 10px; outline: none; font-size: 15px;
}
</style>
</head>
<body>

<div class="app-container">
    
    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
        <div class="brand-logo"><i data-lucide="message-circle-code" style="color: var(--accent);"></i> CodeChat Pro</div>
        
        <!-- Live Current Profile Setup -->
        <div class="my-profile-card">
            <div class="profile-pic-container" onclick="triggerProfilePicUpload()">
                <img id="myAvatarDisplay" class="my-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=default" alt="Avatar">
                <div class="edit-pic-overlay"><i data-lucide="camera" style="width:14px; height:14px; color:white;"></i></div>
            </div>
            <input type="file" id="profilePicInput" style="display: none;" accept="image/*" onchange="uploadProfilePic()">
            <h4 id="myUsernameDisplay" style="margin-top: 5px; font-weight: 600;">Loading...</h4>
            <span style="font-size: 11px; color: var(--success);">● Active Account</span>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchWindow('chat-window')"><i data-lucide="message-square"></i> Messages</button>
            <button class="tab-btn" onclick="switchWindow('network-window')"><i data-lucide="user-plus"></i> Connect & Follow</button>
            <button class="tab-btn" onclick="switchWindow('settings-window')"><i data-lucide="settings"></i> Settings</button>
        </div>
    </div>

    <!-- WINDOW 1: CHAT INTERFACE -->
    <div id="chat-window" class="content-window active">
        <div class="chat-header">
            <div class="user-avatar" id="chatUserAvatar">U</div>
            <div class="chat-user-details">
                <div class="chat-username" id="chatTargetUser">Loading user...</div>
                <div class="chat-status" id="chatTargetStatus">checking status...</div>
            </div>
            <div style="cursor: pointer;"><i data-lucide="phone"></i></div>
        </div>
        <div id="messages"></div>
        <div class="input-container">
            <div class="input-area">
                <i data-lucide="smile" style="color: var(--text-muted); cursor:pointer;"></i>
                <input id="msg" placeholder="Message..." autocomplete="off">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <!-- WINDOW 2: FOLLOW / CONNECT NETWORK -->
    <div id="network-window" class="content-window">
        <div class="panel-header">Connect Network</div>
        <div class="panel-body">
            <!-- Pending Requests (Accept / Reject) -->
            <div class="section-title">Follow Requests (Pending)</div>
            <div id="pendingRequestsList">
                <!-- Javascript will load requests here -->
                <p style="color: var(--text-muted); font-size:14px;">No pending requests</p>
            </div>

            <!-- Discover/Follow New Users -->
            <div class="section-title" style="margin-top: 20px;">Discover Creators</div>
            <div id="discoverUsersList">
                <!-- Javascript will load available users to follow -->
            </div>
        </div>
    </div>

    <!-- WINDOW 3: SETTINGS VIEW -->
    <div id="settings-window" class="content-window">
        <div class="panel-header">Account Settings</div>
        <div class="panel-body" style="max-width: 600px;">
            <div class="settings-group">
                <label>Display Name</label>
                <input type="text" id="settingsUsername" placeholder="Enter your name">
            </div>
            <div class="settings-group">
                <label>Status Privacy</label>
                <select id="settingsPrivacy">
                    <option value="online">Show Active Status (Online)</option>
                    <option value="offline">Stealth Mode (Offline)</option>
                </select>
            </div>
            <button class="btn-primary" style="width: 100%; padding: 14px;" onclick="saveAccountSettings()">Save Configurations</button>
        </div>
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDgOaEVjw-L7O83Wj-N7j_XQYO8RuX4sQU",
    authDomain: "code-chat-a82d0.firebaseapp.com",
    projectId: "code-chat-a82d0",
    storageBucket: "code-chat-a82d0.firebasestorage.app",
    messagingSenderId: "863595576976",
    appId: "1:863595576976:web:61217f6961e3e3a5016215"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Global State Parameters
const params = new URLSearchParams(window.location.search);
const receiverName = params.get("user") || "User Contact";
const receiverUid = params.get("uid") || "demo_receiver";
const myUid = localStorage.getItem("uid") || "current_user_id";

// Initialize Local User Name if not exist
if(!localStorage.getItem("username")) {
    localStorage.setItem("username", "Me_Pro_User");
}

document.getElementById("myUsernameDisplay").innerText = localStorage.getItem("username");
document.getElementById("settingsUsername").value = localStorage.getItem("username");
document.getElementById("chatTargetUser").innerText = receiverName;
document.getElementById("chatUserAvatar").innerText = receiverName.charAt(0).toUpperCase();

// Initialize Lucide Icons
lucide.createIcons();

// --- 1. WINDOW NAVIGATION LOGIC ---
window.switchWindow = function(windowId) {
    document.querySelectorAll('.content-window').forEach(win => win.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    document.getElementById(windowId).classList.add('active');
    event.currentTarget.classList.add('active');
};

// --- 2. PROFILE IMAGE SYSTEM ---
window.triggerProfilePicUpload = function() {
    document.getElementById("profilePicInput").click();
};

window.uploadProfilePic = function() {
    const file = document.getElementById("profilePicInput").files[0];
    if(file) {
        const reader = new FileReader();
        reader.onloadend = function() {
            const base64String = reader.result;
            // Local Storage & Firebase update
            localStorage.setItem("myAvatar", base64String);
            document.getElementById("myAvatarDisplay").src = base64String;
            
            // Sync status collection inside Firestore
            setDoc(doc(db, "userStatus", myUid), {
                avatar: base64String,
                username: localStorage.getItem("username")
            }, { merge: true });
        }
        reader.readAsDataURL(file);
    }
};

// Load Saved Avatar on Startup
if(localStorage.getItem("myAvatar")) {
    document.getElementById("myAvatarDisplay").src = localStorage.getItem("myAvatar");
}

// --- 3. SETTINGS CONTROL PANEL ---
window.saveAccountSettings = async function() {
    const newName = document.getElementById("settingsUsername").value.trim();
    const privacy = document.getElementById("settingsPrivacy").value;

    if(newName === "") return alert("Name cannot be empty!");
    
    localStorage.setItem("username", newName);
    document.getElementById("myUsernameDisplay").innerText = newName;

    await setDoc(doc(db, "userStatus", myUid), {
        username: newName,
        online: (privacy === "online"),
        lastSeen: Date.now()
    }, { merge: true });

    alert("Settings synchronized successfully!");
};

// --- 4. FOLLOW SYSTEM ENGINE (FOLLOW, ACCEPT, REJECT, FOLLOW BACK) ---
window.sendFollowRequest = async function(targetUserId) {
    await setDoc(doc(db, "interactions", `${myUid}_to_${targetUserId}`), {
        from: myUid,
        to: targetUserId,
        status: "pending", // pending, accepted, rejected
        timestamp: Date.now()
    });
    alert("Follow Request Sent!");
    loadNetworkConnections();
};

window.handleRequestAction = async function(requestId, actionStatus) {
    // actionStatus can be 'accepted' or 'rejected'
    await updateDoc(doc(db, "interactions", requestId), {
        status: actionStatus
    });
    alert(`Request ${actionStatus}!`);
};

// Realtime Sync Network & Follow Data
function loadNetworkConnections() {
    // 1. Listen for Incoming Requests to ME
    const qRequests = query(collection(db, "interactions"));
    onSnapshot(qRequests, (snapshot) => {
        let reqHtml = "";
        let discoverHtml = `<div class="user-row">
            <div class="user-row-info">
                <div class="user-avatar">SR</div>
                <div><strong>Suresh Kumar</strong><br><span style="font-size:12px; color:var(--text-muted)">Suggested for you</span></div>
            </div>
            <button class="btn-primary" onclick="sendFollowRequest('suresh_uid')">Follow</button>
        </div>`; // Fallback sample user

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const id = docSnap.id;

            // Incoming requests logic
            if(data.to === myUid && data.status === "pending") {
                reqHtml += `
                    <div class="user-row">
                        <div class="user-row-info">
                            <div class="user-avatar">U</div>
                            <div><strong>User (${data.from.substring(0,5)})</strong> requested to follow you.</div>
                        </div>
                        <div>
                            <button class="btn-success" onclick="handleRequestAction('${id}', 'accepted')">Accept</button>
                            <button class="btn-danger" onclick="handleRequestAction('${id}', 'rejected')">Reject</button>
                        </div>
                    </div>`;
            }

            // Follow back scenario status dashboard
            if(data.from === myUid && data.status === "accepted") {
                discoverHtml += `
                    <div class="user-row">
                        <div class="user-row-info">
                            <div class="user-avatar" style="border: 2px solid var(--success)">✓</div>
                            <div><strong>User (${data.to.substring(0,5)})</strong></div>
                        </div>
                        <button class="btn-secondary" disabled>Following</button>
                    </div>`;
            }
        });

        if(reqHtml !== "") document.getElementById("pendingRequestsList").innerHTML = reqHtml;
        document.getElementById("discoverUsersList").innerHTML = discoverHtml;
    });
}
loadNetworkConnections();

// --- 5. REAL-TIME CHAT OPERATIONS (INSTAGRAM STYLE + DOUBLE TAP LIKE) ---
async function fetchTargetStatus(){
    try{
        const statusDoc = await getDoc(doc(db, "userStatus", receiverUid));
        if(statusDoc.exists()){
            const status = statusDoc.data();
            if(status.online){
                document.getElementById("chatTargetStatus").innerHTML = "🟢 Active now";
                document.getElementById("chatTargetStatus").style.color = "var(--success)";
            } else {
                document.getElementById("chatTargetStatus").innerHTML = "⚫ Offline";
            }
        }
    } catch(err){}
}
fetchTargetStatus();

window.sendMessage = async function(){
    const input = document.getElementById("msg");
    const text = input.value.trim();
    if(text === "") return;

    await addDoc(collection(db, "privateMessages"), {
        sender: myUid,
        receiver: receiverUid,
        text: text,
        time: Date.now(),
        seen: false,
        liked: false
    });
    input.value = "";
};

document.getElementById("msg").addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });

window.toggleLikeMessage = async function(msgId, currentLikeStatus) {
    await updateDoc(doc(db, "privateMessages", msgId), { liked: !currentLikeStatus });
};

// Chat Snapshots Reader
const qMessages = query(collection(db, "privateMessages"), orderBy("time"));
onSnapshot(qMessages, (snapshot) => {
    let html = "";
    snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const msgId = docSnap.id;

        if((data.sender === myUid && data.receiver === receiverUid) || (data.receiver === myUid && data.sender === receiverUid)){
            const mine = data.sender === myUid;
            const msgTime = new Date(data.time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            const heart = data.liked ? `<div class="heart-badge">❤️</div>` : '';

            html += `
                <div class="message-wrapper ${mine ? 'myWrapper myMessage' : 'otherWrapper otherMessage'}">
                    <div class="bubble" ondblclick="toggleLikeMessage('${msgId}', ${data.liked})">
                        ${data.text}
                        ${heart}
                    </div>
                    <div class="msg-time">${msgTime} ${mine ? (data.seen ? '• Seen' : '• Sent') : ''}</div>
                </div>`;
        }
    });
    const mBox = document.getElementById("messages");
    mBox.innerHTML = html;
    mBox.scrollTop = mBox.scrollHeight;
});
</script>
</body>
</html>
