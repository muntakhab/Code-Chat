<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeChat</title>
</head><body style="background:#0f172a;color:white;font-family:Arial;"><h1>💬 CodeChat</h1><button onclick="location.href='search.html'">🔍 Search</button>
<button onclick="location.href='profile.html'">👤 Profile</button>
<button onclick="location.href='settings.html'">⚙️ Settings</button>

<hr><div id="messages"></div><input id="msg" placeholder="Type message">
<button onclick="sendMessage()">Send</button><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyDgOaEVjw-L7O83Wj-N7j_XQYO8RuX4sQU",
authDomain:"code-chat-a82d0.firebaseapp.com",
projectId:"code-chat-a82d0",
storageBucket:"code-chat-a82d0.firebasestorage.app",
messagingSenderId:"863595576976",
appId:"1:863595576976:web:61217f6961e3e3a5016215"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.sendMessage = async function(){

const text = document.getElementById("msg").value;

if(!text) return;

await addDoc(collection(db,"messages"),{
text:text,
time:Date.now()
});

document.getElementById("msg").value="";
}

onSnapshot(collection(db,"messages"),(snapshot)=>{

let html="";

snapshot.forEach((doc)=>{
html += "<p>"+doc.data().text+"</p>";
});

document.getElementById("messages").innerHTML = html;

});

</script></body>
</html>
