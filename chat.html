<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CodeChat</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111827;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .menu {
      display: flex;
      gap: 6px;
    }

    .menu button {
      background: #2563eb;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .menu button:active {
      transform: scale(0.95);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      background: #2563eb;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 80%;
      width: fit-content;
      word-wrap: break-word;
    }

    .empty-message {
      text-align: center;
      color: #94a3b8;
      margin-top: 30px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #111827;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .input-area button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .input-area button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">💬 CodeChat</div>

    <div class="menu">
      <button onclick="location.href='search.html'">🔍</button>
      <button onclick="location.href='profile.html'">👤</button>
      <button onclick="location.href='settings.html'">⚙️</button>
    </div>
  </header>

  <main id="messages">
    <div class="empty-message">Loading messages...</div>
  </main>

  <div class="input-area">
    <input
      id="msg"
      type="text"
      placeholder="Type a message..."
      autocomplete="off"
    >

    <button id="sendBtn" onclick="sendMessage()">
      Send
    </button>
  </div>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy
    } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDgOaEVjw-L7O83Wj-N7j_XQYO8RuX4sQU",
      authDomain: "code-chat-a82d0.firebaseapp.com",
      projectId: "code-chat-a82d0",
      storageBucket: "code-chat-a82d0.firebasestorage.app",
      messagingSenderId: "863595576976",
      appId: "1:863595576976:web:61217f6961e3e3a5016215"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    const messagesRef = collection(db, "messages");

    const messagesQuery = query(
      messagesRef,
      orderBy("time", "asc")
    );


    // Send message
    window.sendMessage = async function () {

      const input = document.getElementById("msg");
      const sendBtn = document.getElementById("sendBtn");

      const text = input.value.trim();

      if (!text) {
        return;
      }

      try {

        sendBtn.disabled = true;

        await addDoc(messagesRef, {
          text: text,
          time: Date.now()
        });

        input.value = "";
        input.focus();

      } catch (error) {

        console.error("Message sending error:", error);

        alert("Message could not be sent.");

      } finally {

        sendBtn.disabled = false;

      }
    };


    // Press Enter to send
    document.getElementById("msg").addEventListener("keydown", function (event) {

      if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
      }

    });


    // Receive messages in real time
    onSnapshot(
      messagesQuery,

      (snapshot) => {

        const messagesBox = document.getElementById("messages");

        messagesBox.innerHTML = "";

        if (snapshot.empty) {

          messagesBox.innerHTML =
            '<div class="empty-message">No messages yet. Start the conversation!</div>';

          return;
        }


        snapshot.forEach((doc) => {

          const data = doc.data();

          const messageElement = document.createElement("div");

          messageElement.className = "message";

          // textContent prevents HTML/script injection
          messageElement.textContent = data.text || "";

          messagesBox.appendChild(messageElement);

        });


        messagesBox.scrollTop = messagesBox.scrollHeight;

      },

      (error) => {

        console.error("Firestore error:", error);

        document.getElementById("messages").innerHTML =
          '<div class="empty-message">Unable to load messages.</div>';

      }
    );

  </script>

</body>
</html>
