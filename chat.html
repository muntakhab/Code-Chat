<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeChat</title><style>
body{
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

#messages{
height:400px;
overflow-y:auto;
border:1px solid #333;
padding:10px;
margin-bottom:10px;
border-radius:10px;
}

.message{
background:#2563eb;
padding:10px;
margin:5px 0;
border-radius:10px;
}

input{
width:75%;
padding:10px;
border:none;
border-radius:8px;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
margin-left:5px;
}
</style></head><body><div class="topbar">
<h2>💬 CodeChat</h2><div>
<button onclick="location.href='profile.html'">
👤 Profile
</button><button onclick="location.href='settings.html'">
⚙️ Settings
</button>
</div>
</div><div id="messages"></div><input id="msg" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
query
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDgOaEVjw-L7O83Wj-N7j_XQYO8RuX4sQU",
  authDomain: "code-chat-a82d0.firebaseapp.com",
  projectId: "code-chat-a82d0",
  storageBucket: "code-chat-a82d0.firebasestorage.app",
  messagingSenderId: "863595576976",
  appId: "1:863595576976:web:61217f6961e3e3a5016215"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.sendMessage = async function(){

let text = document.getElementById("msg").value;

if(text.trim()=="") return;

await addDoc(collection(db,"messages"),{
text:text,
time:Date.now()
});

document.getElementById("msg").value="";
}

const q = query(collection(db,"messages"));

onSnapshot(q,(snapshot)=>{

let html="";

snapshot.forEach((doc)=>{

html += `
<div class="message">
${doc.data().text}
</div>
`;

});

document.getElementById("messages").innerHTML = html;

});

</script></body>
</html>
