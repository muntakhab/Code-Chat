<head>
<title>CodeChat</title>
</head>
<body style="background:#0f172a;color:white;font-family:sans-serif;"><h1>💬 CodeChat</h1><div id="messages">
<p>Hello 👋</p>
</div><input id="msg" placeholder="Type a message">
<button onclick="sendMessage()">Send</button><script>
function sendMessage() {
  let text = document.getElementById("msg").value;

  if(text=="") return;

  document.getElementById("messages").innerHTML +=
  "<p>" + text + "</p>";

  document.getElementById("msg").value = "";
}
</script></body>
</html>
