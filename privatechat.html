<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat</title><style>
body{
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
margin:0;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
background:#111827;
padding:15px;
font-size:20px;
font-weight:bold;
}

#messages{
flex:1;
overflow-y:auto;
padding:15px;
}

.myMessage{
background:#2563eb;
padding:10px;
border-radius:12px;
margin-bottom:10px;
margin-left:auto;
max-width:75%;
}

.otherMessage{
background:#374151;
padding:10px;
border-radius:12px;
margin-bottom:10px;
max-width:75%;
}

.time{
font-size:11px;
opacity:.7;
margin-top:5px;
}

.input-area{
display:flex;
padding:10px;
background:#111827;
}

.input-area input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
}

.input-area button{
margin-left:10px;
padding:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
}
</style></head>
<body><div class="header" id="user">
Private Chat
</div><div id="messages"></div><div class="input-area">
<input id="msg" placeholder="Type message...">
<button onclick="sendMessage()">Send</button>
</div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyDgOaEVjw-L7O83Wj-N7j_XQYO8RuX4sQU",
authDomain:"code-chat-a82d0.firebaseapp.com",
projectId:"code-chat-a82d0",
storageBucket:"code-chat-a82d0.firebasestorage.app",
messagingSenderId:"863595576976",
appId:"1:863595576976:web:61217f6961e3e3a5016215"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);

const receiverName = params.get("user");
const receiverUid = params.get("uid");

const myUid = localStorage.getItem("uid");

document.getElementById("user").innerHTML =
"💬 " + receiverName;

window.sendMessage = async function(){

const text = document.getElementById("msg").value;

if(text.trim()=="") return;

await addDoc(collection(db,"privateMessages"),{
sender: myUid,
receiver: receiverUid,
text: text,
time: Date.now()
});

document.getElementById("msg").value="";
}

const q = query(
collection(db,"privateMessages"),
orderBy("time")
);

onSnapshot(q,(snapshot)=>{

let html="";

snapshot.forEach((doc)=>{

const data = doc.data();

if(
(data.sender===myUid && data.receiver===receiverUid) ||
(data.sender===receiverUid && data.receiver===myUid)
){

const mine = data.sender===myUid;

const time = new Date(data.time)
.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});

html += `
<div class="${mine ? 'myMessage' : 'otherMessage'}">
${data.text}
<div class="time">${time}</div>
</div>
`;

}

});

document.getElementById("messages").innerHTML = html;

document.getElementById("messages").scrollTop =
document.getElementById("messages").scrollHeight;

});

</script></body>
</html>
