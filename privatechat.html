<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat</title><style>
body{
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
margin:0;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
background:#111827;
padding:15px;
font-size:20px;
font-weight:bold;
}

#messages{
flex:1;
padding:15px;
overflow-y:auto;
}

.message{
background:#2563eb;
padding:10px;
border-radius:10px;
margin-bottom:10px;
max-width:80%;
}

.input-area{
display:flex;
padding:10px;
background:#111827;
}

.input-area input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
}

.input-area button{
margin-left:10px;
padding:12px 18px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
}
</style></head><body><div class="header" id="user">
Private Chat
</div><div id="messages">
<div class="message">
Start chatting...
</div>
</div><div class="input-area">
<input id="msg" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</div><script>

const params = new URLSearchParams(window.location.search);

document.getElementById("user").innerHTML =
"💬 Chat with " + params.get("user");

function sendMessage(){

let text = document.getElementById("msg").value;

if(text.trim()=="") return;

document.getElementById("messages").innerHTML +=
'<div class="message">'+text+'</div>';

document.getElementById("msg").value="";

}

</script></body>
</html>
