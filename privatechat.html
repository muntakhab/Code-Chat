<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - CodeChat</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { background: #000000; color: #ffffff; height: 100vh; display: flex; justify-content: center; }
    .chat-container { width: 100%; max-width: 600px; background: #000000; display: flex; flex-direction: column; height: 100vh; border-left: 1px solid #262626; border-right: 1px solid #262626; }
    
    /* Instagram Style Chat Header */
    .chat-header { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #262626; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .back-btn { background: transparent; border: none; color: white; cursor: pointer; }
    .avatar-circle { width: 40px; height: 40px; border-radius: 50%; background: #262626; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; overflow: hidden; object-fit: cover; }
    .user-info h3 { font-size: 15px; font-weight: 600; }
    .user-info span { font-size: 12px; color: #8e8e8e; }
    .header-icons { display: flex; gap: 18px; color: #ffffff; }
    .header-icons i { cursor: pointer; width: 22px; }

    /* Message Area */
    .messages-box { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg-wrapper { display: flex; align-items: flex-end; gap: 8px; max-width: 75%; }
    .msg-wrapper.sent { align-self: flex-end; flex-direction: row-reverse; }
    .msg-wrapper.received { align-self: flex-start; }
    
    .chat-avatar { width: 28px; height: 28px; border-radius: 50%; background: #363636; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; overflow: hidden; object-fit: cover; }
    .bubble { padding: 10px 16px; border-radius: 20px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .sent .bubble { background: #3797f0; color: #ffffff; border-bottom-right-radius: 4px; }
    .received .bubble { background: #262626; color: #ffffff; border-bottom-left-radius: 4px; }

    /* Input Dock */
    .input-footer { padding: 12px 16px; display: flex; align-items: center; }
    .input-wrapper { width: 100%; background: #121212; border: 1px solid #262626; border-radius: 24px; padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
    .input-wrapper input { flex: 1; background: transparent; border: none; color: white; font-size: 14px; outline: none; }
    .send-btn { background: transparent; border: none; color: #0095f6; font-weight: 600; font-size: 14px; cursor: pointer; display: none; }
</style>
</head>
<body>

<div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
        <div class="header-left" onclick="location.href='search.html'">
            <button class="back-btn"><i data-lucide="arrow-left"></i></button>
            <div class="avatar-circle" id="targetAvatar">U</div>
            <div class="user-info">
                <h3 id="targetUsername">username</h3>
                <span>Active now</span>
            </div>
        </div>
        <div class="header-icons">
            <i data-lucide="phone" onclick="alert('Calling...')"></i>
            <i data-lucide="video" onclick="alert('Starting Video Call...')"></i>
            <i data-lucide="info" onclick="alert('User Blocked!')"></i>
        </div>
    </header>

    <!-- Messages -->
    <div class="messages-box" id="chatBox"></div>

    <!-- Input Footer -->
    <footer class="input-footer">
        <div class="input-wrapper">
            <i data-lucide="smile" style="color: #8e8e8e; width: 22px;"></i>
            <input id="msgInput" placeholder="Message..." oninput="toggleSendBtn()">
            <button id="sendBtn" class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDgOaEVjw-L7O83Wj-N7j_XQYO8RuX4sQU",
    authDomain: "code-chat-a82d0.firebaseapp.com",
    projectId: "code-chat-a82d0",
    storageBucket: "code-chat-a82d0.firebasestorage.app",
    messagingSenderId: "863595576976",
    appId: "1:863595576976:web:61217f6961e3e3a5016215"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// URL Extraction & Setup
const urlParams = new URLSearchParams(window.location.search);
const targetUser = urlParams.get('user') || "Chat User";
const targetUID = urlParams.get('uid') || "";

const myEmail = localStorage.getItem("email") || "me@codechat.com";
const myUsername = myEmail.split("@")[0];
const myAvatar = localStorage.getItem("userAvatar") || "";

document.getElementById("targetUsername").innerText = targetUser.toLowerCase();

// Load Target User Profile Photo (Static placeholder or direct Firebase sync can expand this)
// Right now it checks if we received any avatar info or shows initials
document.getElementById("targetAvatar").innerText = targetUser.charAt(0).toUpperCase();

const chatRoomId = [myUsername, targetUser].sort().join("_");

window.toggleSendBtn = function() {
    const input = document.getElementById("msgInput").value.trim();
    document.getElementById("sendBtn").style.display = input.length > 0 ? "block" : "none";
};

window.sendMessage = async function() {
    const inputField = document.getElementById("msgInput");
    const text = inputField.value.trim();
    if (!text) return;

    inputField.value = "";
    toggleSendBtn();

    try {
        await addDoc(collection(db, "chats", chatRoomId, "messages"), {
            sender: myUsername,
            text: text,
            avatar: myAvatar, // Saves your photo url inside the message structure
            timestamp: new Date().getTime()
        });
    } catch (e) {
        console.error("Message send failure: ", e);
    }
};

function listenMessages() {
    const q = query(collection(db, "chats", chatRoomId, "messages"), orderBy("timestamp", "asc"));
    onSnapshot(q, (snapshot) => {
        let html = "";
        snapshot.forEach((doc) => {
            const data = doc.data();
            const isMe = data.sender === myUsername;
            const chatClass = isMe ? "sent" : "received";
            
            // Avatar display check inside chat bubble logic
            let currentAvatarHtml = "";
            if (isMe) {
                currentAvatarHtml = myAvatar ? `<img src="${myAvatar}" class="chat-avatar">` : `<div class="chat-avatar">${myUsername.charAt(0).toUpperCase()}</div>`;
            } else {
                currentAvatarHtml = data.avatar ? `<img src="${data.avatar}" class="chat-avatar">` : `<div class="chat-avatar">${targetUser.charAt(0).toUpperCase()}</div>`;
            }

            html += `
            <div class="msg-wrapper ${chatClass}">
                ${currentAvatarHtml}
                <div class="bubble">${data.text}</div>
            </div>`;
        });
        const box = document.getElementById("chatBox");
        box.innerHTML = html;
        box.scrollTop = box.scrollHeight;
    });
}

lucide.createIcons();
listenMessages();
</script>
</body>
</html>
