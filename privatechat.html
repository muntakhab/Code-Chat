<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { background: #000000; color: white; height: 100vh; display: flex; justify-content: center; }
    .chat-window { width: 100%; max-width: 600px; height: 100vh; border-left: 1px solid #262626; border-right: 1px solid #262626; display: flex; flex-direction: column; position: relative; }
    .chat-header { padding: 14px 20px; border-bottom: 1px solid #262626; display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
    .back-btn { background: transparent; border: none; color: white; cursor: pointer; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .message-row { display: flex; width: 100%; }
    .msg-mine { justify-content: flex-end; }
    .msg-other { justify-content: flex-start; }
    .bubble { padding: 12px 16px; border-radius: 22px; font-size: 14px; max-width: 70%; word-wrap: break-word; }
    .msg-mine .bubble { background: #0095f6; color: white; border-bottom-right-radius: 4px; }
    .msg-other .bubble { background: #262626; color: white; border-bottom-left-radius: 4px; }
    .block-banner { display: none; background: #1a0507; border: 1px solid #ed4956; color: #ed4956; text-align: center; padding: 10px; font-size: 13px; }
    .input-area { padding: 16px; }
    .input-pill { display: flex; align-items: center; padding: 4px 14px; border: 1px solid #363636; border-radius: 24px; gap: 12px; }
    .input-pill input { flex: 1; padding: 10px 0; border: none; background: transparent; color: white; outline: none; }
    .input-pill button { background: transparent; border: none; color: #0095f6; font-weight: 600; cursor: pointer; }
    .options-modal { position: absolute; top: 60px; right: 20px; background: #1e1e1e; border: 1px solid #262626; border-radius: 12px; width: 180px; display: none; flex-direction: column; z-index: 100; }
    .modal-row { padding: 12px 16px; font-size: 14px; cursor: pointer; text-align: left; background: transparent; border: none; color: white; width: 100%; }
    .modal-row:hover { background: #262626; }
    .row-danger { color: #ed4956; font-weight: 600; }
</style>
</head>
<body>
<div class="chat-window">
    <header class="chat-header">
        <button class="back-btn" onclick="location.href='search.html'"><i data-lucide="arrow-left"></i></button>
        <div style="font-weight:600;" id="chatTitle">Chat</div>
        <div style="cursor:pointer;" onclick="toggleMenu()"><i data-lucide="more-horizontal"></i></div>
    </header>

    <div class="options-modal" id="optionsMenu">
        <button class="modal-row row-danger" id="blockBtn" onclick="triggerBlock()">Block User</button>
    </div>

    <div id="messages"></div>
    <div class="block-banner" id="blockBanner">You have blocked this user.</div>

    <footer class="input-area">
        <div class="input-pill">
            <input id="msg" placeholder="Message..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDgOaEVjw-L7O83Wj-N7j_XQYO8RuX4sQU",
    authDomain: "code-chat-a82d0.firebaseapp.com",
    projectId: "code-chat-a82d0",
    storageBucket: "code-chat-a82d0.firebasestorage.app",
    messagingSenderId: "863595576976",
    appId: "1:863595576976:web:61217f6961e3e3a5016215"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const targetUser = urlParams.get('user') || "User";
document.getElementById("chatTitle").innerText = targetUser;

const mySessionId = "sender_current_user"; 
let isBlocked = false;

window.toggleMenu = function() {
    const m = document.getElementById("optionsMenu");
    m.style.display = m.style.display === "flex" ? "none" : "flex";
}

window.triggerBlock = function() {
    isBlocked = !isBlocked;
    document.getElementById("optionsMenu").style.display = "none";
    document.getElementById("msg").disabled = isBlocked;
    document.getElementById("blockBanner").style.display = isBlocked ? "block" : "none";
    document.getElementById("blockBtn").innerText = isBlocked ? "Unblock User" : "Block User";
}

window.sendMessage = async function(){
    if(isBlocked) return;
    const text = document.getElementById("msg").value.trim();
    if(!text) return;
    await addDoc(collection(db, "messages"), { text: text, senderId: mySessionId, time: Date.now() });
    document.getElementById("msg").value = "";
};

const q = query(collection(db, "messages"), orderBy("time"));
onSnapshot(q, (snapshot) => {
    let html = "";
    snapshot.forEach((doc) => {
        const data = doc.data();
        const mine = data.senderId === mySessionId;
        html += `<div class="message-row ${mine ? 'msg-mine' : 'msg-other'}"><div class="bubble">${data.text}</div></div>`;
    });
    const box = document.getElementById("messages");
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
});
lucide.createIcons();
</script>
</body>
</html>
