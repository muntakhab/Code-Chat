<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeChat - Fixed</title>
<style>
    body { background:#0f172a; color:white; font-family:Arial, sans-serif; padding:20px; }
    #messages { background:#1e293b; padding:15px; border-radius:10px; min-height:200px; max-height:400px; overflow-y:auto; margin-bottom:15px; }
    button { padding:10px 15px; border-radius:8px; border:none; background:#2563eb; color:white; cursor:pointer; margin-right:5px; }
    .nav-btn { background:#475569; }
    input { padding:10px; width:70%; border-radius:8px; border:none; outline:none; color:black; }
    p { margin:5px 0; padding:8px; background:#334155; border-radius:6px; }
</style>
</head>
<body>

<h1>💬 CodeChat</h1>

   <div style="margin-bottom: 15px;">
    <button class="nav-btn" onclick="location.href='search.html'">🔍 Search</button>
    <button class="nav-btn" onclick="location.href='profile.html'">👤 Profile</button>
    <button class="nav-btn" onclick="location.href='settings.html'">⚙️ Settings</button>
</div>

<hr style="border-color:#334155; margin-bottom:15px;">

<div id="messages"></div>

<div style="display: flex; gap: 10px;">
    <input id="msg" placeholder="Type message...">
    <button onclick="sendMyMessage()">Send</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDgOaEVjw-L7O83Wj-N7j_XQYO8RuX4sQU",
    authDomain: "code-chat-a82d0.firebaseapp.com",
    projectId: "code-chat-a82d0",
    storageBucket: "code-chat-a82d0.firebasestorage.app",
    messagingSenderId: "863595576976",
    appId: "1:863595576976:web:61217f6961e3e3a5016215"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.sendMyMessage = async function() {
    const inputElement = document.getElementById("msg");
    const text = inputElement.value.trim();
    if(!text) return;

    try {
        await addDoc(collection(db, "messages"), {
            text: text,
            time: Date.now()
        });
        inputElement.value = "";
    } catch (error) {
        console.error("Error sending message: ", error);
    }
};

const q = query(collection(db, "messages"), orderBy("time", "asc"));
onSnapshot(q, (snapshot) => {
    let html = "";
    snapshot.forEach((doc) => {
        html += `<p>${doc.data().text}</p>`;
    });
    const msgDiv = document.getElementById("messages");
    msgDiv.innerHTML = html;
    msgDiv.scrollTop = msgDiv.scrollHeight;
});
</script>

</body>
</html>
