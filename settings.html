<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

.box{
background:#1e293b;
padding:15px;
border-radius:12px;
margin-top:15px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
margin-top:10px;
}
</style>
</head>

<body>

<h1>⚙️ Settings</h1>

<div class="box">
<p>Code Chat Settings</p>

<button onclick="window.location.href='chat.html'">
💬 Back To Chat
</button>

<button onclick="logout()">
🚪 Logout
</button>
</div>

<script>
function logout(){
localStorage.removeItem("uid");
localStorage.removeItem("email");
window.location.href="login.html";
}
</script>

</body>
</html>
