<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title><style>
body{
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

.box{
background:#1e293b;
padding:15px;
border-radius:12px;
margin-top:15px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
margin-top:10px;
cursor:pointer;
}
</style></head><body><h1>⚙️ Settings</h1><div class="box"><p>CodeChat Settings</p><button onclick="window.location.href='chat.html'">
💬 Back To Chat
</button><button onclick="logout()">
🚪 Logout
</button></div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyDgOaEVjw-L7O83Wj-N7j_XQYO8RuX4sQU",
authDomain:"code-chat-a82d0.firebaseapp.com",
projectId:"code-chat-a82d0",
storageBucket:"code-chat-a82d0.firebasestorage.app",
messagingSenderId:"863595576976",
appId:"1:863595576976:web:61217f6961e3e3a5016215"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.logout = async function(){

const uid = localStorage.getItem("uid");

if(uid){

await setDoc(
doc(db,"userStatus",uid),
{
uid:uid,
online:false,
lastSeen:Date.now()
},
{merge:true}
);

}

localStorage.removeItem("uid");
localStorage.removeItem("email");

window.location.href="login.html";

}

</script></body>
</html>
