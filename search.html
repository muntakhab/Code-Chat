<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Discover — CodeChat</title>

  <script src="https://unpkg.com/lucide@latest"></script>


  <style>

    :root {
      --bg: #000;
      --surface: #111;
      --surface-2: #1c1c1c;
      --border: #292929;
      --primary: #0095f6;
      --text: #f5f5f5;
      --muted: #a8a8a8;
    }


    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }


    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);

      display: flex;
      justify-content: center;
    }


    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }


    /* Header */

    .header {
      height: 60px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 16px;

      border-bottom: 1px solid var(--border);
    }


    .profile-name {
      display: flex;
      align-items: center;
      gap: 6px;

      cursor: pointer;
    }


    .profile-name h2 {
      font-size: 19px;
      font-weight: 700;
    }


    .header-actions {
      display: flex;
      gap: 18px;
    }


    .header-actions button {
      width: 36px;
      height: 36px;

      border: none;
      background: transparent;
      color: white;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }


    .header-actions button:active {
      background: #1f1f1f;
    }


    /* Stories */

    .stories {
      display: flex;

      gap: 14px;

      padding: 12px 16px;

      overflow-x: auto;

      border-bottom: 1px solid var(--border);

      scrollbar-width: none;
    }


    .stories::-webkit-scrollbar {
      display: none;
    }


    .story {
      min-width: 65px;

      display: flex;
      flex-direction: column;

      align-items: center;

      gap: 5px;

      color: var(--muted);

      font-size: 11px;

      cursor: pointer;
    }


    .story-ring {
      width: 62px;
      height: 62px;

      border-radius: 50%;

      padding: 3px;

      background: #333;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .story-ring.has-story {
      background:
        linear-gradient(
          135deg,
          #f9ce34,
          #ee2a7b,
          #6228d7
        );
    }


    .story-avatar {
      width: 56px;
      height: 56px;

      border-radius: 50%;

      background: #262626;

      border: 2px solid black;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;
      font-weight: 700;

      overflow: hidden;
    }


    .story-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    /* Search */

    .search-area {
      padding: 12px 16px;
    }


    .search-box {
      position: relative;
    }


    .search-box svg {
      position: absolute;

      left: 13px;
      top: 50%;

      transform: translateY(-50%);

      width: 17px;

      color: #8e8e8e;
    }


    #search {
      width: 100%;

      padding: 12px 14px 12px 42px;

      background: var(--surface-2);

      border: 1px solid transparent;

      border-radius: 12px;

      color: white;

      outline: none;

      font-size: 15px;
    }


    #search:focus {
      border-color: #3b3b3b;
    }


    /* Users */

    #users {
      flex: 1;

      overflow-y: auto;

      padding-bottom: 20px;
    }


    .user-card {
      width: 100%;

      display: flex;
      align-items: center;

      padding: 12px 16px;

      cursor: pointer;

      border-bottom: 1px solid #151515;
    }


    .user-card:hover {
      background: #0d0d0d;
    }


    .avatar {
      width: 52px;
      height: 52px;

      flex-shrink: 0;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #4f46e5,
          #06b6d4
        );

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;
      font-weight: 700;

      overflow: hidden;

      margin-right: 13px;
    }


    .avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    .user-info {
      flex: 1;

      min-width: 0;
    }


    .user-info h3 {
      font-size: 15px;

      font-weight: 650;

      margin-bottom: 3px;
    }


    .user-handle {
      color: var(--muted);

      font-size: 13px;

      margin-bottom: 4px;
    }


    .user-bio {
      color: #858585;

      font-size: 12px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .message-button {
      width: 38px;
      height: 36px;

      border: none;

      border-radius: 9px;

      background: var(--primary);

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;
    }


    .loading,
    .empty,
    .error {
      text-align: center;

      padding: 45px 20px;

      color: var(--muted);

      font-size: 14px;
    }


    .error {
      color: #ff6b6b;
    }


    /* Story modal */

    .story-modal {
      display: none;

      position: fixed;

      inset: 0;

      background: #000;

      z-index: 1000;

      align-items: center;

      justify-content: center;
    }


    .story-modal img {
      width: 100%;
      max-height: 85vh;

      object-fit: contain;
    }


    .story-close {
      position: absolute;

      top: 22px;
      right: 20px;

      width: 40px;
      height: 40px;

      border: none;

      border-radius: 50%;

      background: rgba(255,255,255,0.12);

      color: white;

      display: flex;

      align-items: center;
      justify-content: center;

      cursor: pointer;
    }


    .story-progress {
      position: absolute;

      top: 12px;
      left: 5%;

      width: 90%;
      height: 3px;

      background: #333;

      border-radius: 5px;

      overflow: hidden;
    }


    .story-progress-bar {
      width: 0%;
      height: 100%;

      background: white;
    }


    /* Mobile */

    @media (max-width: 380px) {

      .header {
        padding: 0 12px;
      }

      .stories {
        padding-left: 12px;
      }

      .search-area {
        padding: 10px 12px;
      }

      .user-card {
        padding: 11px 12px;
      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- Header -->

  <header class="header">

    <div
      class="profile-name"
      onclick="location.href='profile.html'"
    >

      <h2 id="currentUsername">
        CodeChat
      </h2>

      <i
        data-lucide="chevron-down"
        style="width:16px;"
      ></i>

    </div>


    <div class="header-actions">

      <button
        onclick="triggerStoryUpload()"
        aria-label="Create story"
      >
        <i data-lucide="plus-circle"></i>
      </button>


      <button
        onclick="location.href='chat.html'"
        aria-label="Messages"
      >
        <i data-lucide="message-circle"></i>
      </button>

    </div>

  </header>


  <!-- Story upload -->

  <input
    type="file"
    id="storyFileInput"
    accept="image/*"
    hidden
  >


  <!-- Stories -->

  <section class="stories">

    <div
      class="story"
      id="myStory"
      onclick="openMyStory()"
    >

      <div
        class="story-ring"
        id="myStoryRing"
      >

        <div
          class="story-avatar"
          id="myStoryAvatar"
        >
          +
        </div>

      </div>

      <span>Your story</span>

    </div>


    <div
      id="otherStories"
      style="
        display:flex;
        gap:14px;
      "
    ></div>

  </section>


  <!-- Search -->

  <section class="search-area">

    <div class="search-box">

      <i data-lucide="search"></i>

      <input
        id="search"
        type="search"
        placeholder="Search people on CodeChat..."
        autocomplete="off"
      >

    </div>

  </section>


  <!-- Users -->

  <main id="users">

    <div class="loading">
      Loading people...
    </div>

  </main>


</div>


<!-- Story modal -->

<div
  class="story-modal"
  id="storyModal"
>

  <div class="story-progress">

    <div
      class="story-progress-bar"
      id="storyProgress"
    ></div>

  </div>


  <button
    class="story-close"
    onclick="closeStory()"
    aria-label="Close story"
  >

    <i data-lucide="x"></i>

  </button>


  <img
    id="storyImage"
    src=""
    alt="Story"
  >

</div>


<script type="module">


import {
  initializeApp
} from
  "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
} from
  "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs
} from
  "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDgOaEVjw-L7O83Wj-N7j_XQYO8RuX4sQU",

  authDomain:
    "code-chat-a82d0.firebaseapp.com",

  projectId:
    "code-chat-a82d0",

  storageBucket:
    "code-chat-a82d0.firebasestorage.app",

  messagingSenderId:
    "863595576976",

  appId:
    "1:863595576976:web:61217f6961e3e3a5016215"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


let currentUser = null;

let usersData = [];

let myStoryData =
  localStorage.getItem("myLiveStory") || "";


const usersContainer =
  document.getElementById("users");

const searchInput =
  document.getElementById("search");

const currentUsername =
  document.getElementById("currentUsername");


// Authentication

onAuthStateChanged(
  auth,
  async (user) => {

    if (!user) {

      window.location.href =
        "login.html";

      return;

    }


    currentUser = user;

    currentUsername.textContent =
      user.email
        ? user.email.split("@")[0]
        : "CodeChat";


    await loadUsers();

  }
);


// Load users

async function loadUsers() {

  try {

    usersContainer.innerHTML =
      '<div class="loading">Loading people...</div>';


    const snapshot =
      await getDocs(
        collection(
          db,
          "users"
        )
      );


    usersData = [];


    snapshot.forEach(
      (userDoc) => {

        const data =
          userDoc.data();


        // Don't show current user

        if (
          data.uid ===
          currentUser.uid
        ) {

          return;

        }


        usersData.push({

          uid:
            data.uid ||
            userDoc.id,

          username:
            data.username ||
            "user",

          displayName:
            data.displayName ||
            data.username ||
            "CodeChat User",

          bio:
            data.bio ||
            "Welcome to CodeChat! 🚀",

          photoURL:
            data.photoURL ||
            "",

          followersCount:
            data.followersCount ||
            0,

          followingCount:
            data.followingCount ||
            0

        });

      }
    );


    renderUsers(usersData);


  } catch (error) {

    console.error(
      "User loading error:",
      error
    );


    usersContainer.innerHTML =
      '<div class="error">Unable to load users.</div>';

  }

}


// Render users

function renderUsers(
  users
) {

  usersContainer.innerHTML = "";


  if (!users.length) {

    usersContainer.innerHTML =
      '<div class="empty">No other users found.</div>';

    return;

  }


  users.forEach(
    (user) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "user-card";


      card.dataset.username =
        (
          user.username +
          " " +
          user.displayName
        ).toLowerCase();


      // Avatar

      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "avatar";


      if (user.photoURL) {

        const image =
          document.createElement(
            "img"
          );

        image.src =
          user.photoURL;

        image.alt =
          "Profile picture";


        image.onerror =
          () => {

            image.remove();

            avatar.textContent =
              user.username
                .charAt(0)
                .toUpperCase();

          };


        avatar.appendChild(
          image
        );

      } else {

        avatar.textContent =
          user.username
            .charAt(0)
            .toUpperCase();

      }


      // User information

      const info =
        document.createElement(
          "div"
        );

      info.className =
        "user-info";


      const name =
        document.createElement(
          "h3"
        );

      name.textContent =
        user.displayName;


      const handle =
        document.createElement(
          "div"
        );

      handle.className =
        "user-handle";

      handle.textContent =
        "@" + user.username;


      const bio =
        document.createElement(
          "div"
        );

      bio.className =
        "user-bio";

      bio.textContent =
        user.bio;


      info.appendChild(name);

      info.appendChild(handle);

      info.appendChild(bio);


      // Message button

      const messageButton =
        document.createElement(
          "button"
        );


      messageButton.className =
        "message-button";


      messageButton.innerHTML =
        '<i data-lucide="message-circle"></i>';


      messageButton.title =
        "Message";


      messageButton.onclick =
        (event) => {

          event.stopPropagation();

          openPrivateChat(
            user
          );

        };


      // Click entire card

      card.onclick =
        () => {

          openPrivateChat(
            user
          );

        };


      card.appendChild(
        avatar
      );

      card.appendChild(
        info
      );

      card.appendChild(
        messageButton
      );


      usersContainer.appendChild(
        card
      );

    }
  );


  lucide.createIcons();

}


// Open private chat

function openPrivateChat(
  user
) {

  const url =
    "privatechat.html?uid=" +
    encodeURIComponent(
      user.uid
    );


  window.location.href =
    url;

}


// Search

searchInput.addEventListener(
  "input",
  () => {

    const query =
      searchInput.value
        .trim()
        .toLowerCase();


    if (!query) {

      renderUsers(
        usersData
      );

      return;

    }


    const filtered =
      usersData.filter(
        (user) => {

          return (

            user.username
              .toLowerCase()
              .includes(query)

            ||

            user.displayName
              .toLowerCase()
              .includes(query)

            ||

            user.bio
              .toLowerCase()
              .includes(query)

          );

        }
      );


    renderUsers(
      filtered
    );

  }
);


// Story upload

window.triggerStoryUpload =
  function () {

    document
      .getElementById(
        "storyFileInput"
      )
      .click();

  };


document
  .getElementById(
    "storyFileInput"
  )
  .addEventListener(
    "change",
    (event) => {

      const file =
        event.target.files[0];


      if (!file) return;


      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        alert(
          "Please select an image."
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        (e) => {

          myStoryData =
            e.target.result;


          localStorage.setItem(
            "myLiveStory",
            myStoryData
          );


          updateMyStory();


          alert(
            "Story added successfully."
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );


// Update story button

function updateMyStory() {

  const avatar =
    document.getElementById(
      "myStoryAvatar"
    );

  const ring =
    document.getElementById(
      "myStoryRing"
    );


  avatar.innerHTML = "";


  if (myStoryData) {

    ring.classList.add(
      "has-story"
    );


    const image =
      document.createElement(
        "img"
      );


    image.src =
      myStoryData;


    image.alt =
      "Your story";


    avatar.appendChild(
      image
    );


  } else {

    ring.classList.remove(
      "has-story"
    );


    avatar.textContent =
      "+";

  }

}


// Open story

let storyTimer = null;


window.openMyStory =
  function () {

    if (!myStoryData) {

      triggerStoryUpload();

      return;

    }


    const modal =
      document.getElementById(
        "storyModal"
      );


    const image =
      document.getElementById(
        "storyImage"
      );


    const progress =
      document.getElementById(
        "storyProgress"
      );


    image.src =
      myStoryData;


    progress.style.width =
      "0%";


    modal.style.display =
      "flex";


    let start =
      Date.now();


    clearInterval(
      storyTimer
    );


    storyTimer =
      setInterval(
        () => {

          const elapsed =
            Date.now() -
            start;


          const percentage =
            Math.min(
              (elapsed / 5000) * 100,
              100
            );


          progress.style.width =
            percentage + "%";


          if (
            percentage >= 100
          ) {

            closeStory();

          }

        },
        50
      );

  };


// Close story

window.closeStory =
  function () {

    document
      .getElementById(
        "storyModal"
      )
      .style.display =
      "none";


    clearInterval(
      storyTimer
    );

  };


updateMyStory();

lucide.createIcons();

</script>

</body>
</html>
