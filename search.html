<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Users</title><style>
body{
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

h2{
text-align:center;
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-bottom:15px;
}

.user{
background:#1e293b;
padding:15px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
}
</style></head><body><h2>🔍 Search Users</h2><input id="search" placeholder="Search username..."><div id="users"></div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDgOaEVjw-L7O83Wj-N7j_XQYO8RuX4sQU",
authDomain: "code-chat-a82d0.firebaseapp.com",
projectId: "code-chat-a82d0",
storageBucket: "code-chat-a82d0.firebasestorage.app",
messagingSenderId: "863595576976",
appId: "1:863595576976:web:61217f6961e3e3a5016215"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const usersDiv = document.getElementById("users");

const snapshot = await getDocs(collection(db,"users"));

snapshot.forEach((doc)=>{

usersDiv.innerHTML += `
<div class="user"
onclick="location.href='privatechat.html?user=${doc.data().username}'">
👤 ${doc.data().username}
</div>
`;

});

</script></body>
</html>
