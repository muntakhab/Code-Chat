<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>CodeChat - Create Post</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background: #000;
        color: #fff;
        min-height: 100vh;
        padding-bottom: 70px;
    }

    .upload-container {
        width: 100%;
        max-width: 600px;
        min-height: 100vh;
        margin: auto;
        background: #000;
        border-left: 1px solid #202020;
        border-right: 1px solid #202020;
    }

    /* HEADER */

    .upload-header {
        position: sticky;
        top: 0;
        z-index: 100;

        height: 60px;
        padding: 0 16px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        background: rgba(0, 0, 0, 0.94);
        backdrop-filter: blur(14px);

        border-bottom: 1px solid #202020;
    }

    .cancel-btn {
        border: none;
        background: transparent;
        color: #aaa;
        font-size: 15px;
        cursor: pointer;
    }

    .upload-title {
        font-size: 18px;
        font-weight: 700;
    }

    .share-btn {
        border: none;
        background: transparent;
        color: #4da3ff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
    }

    .share-btn:disabled {
        color: #555;
        cursor: not-allowed;
    }

    /* MEDIA SELECTOR */

    .select-box {
        width: 100%;
        min-height: 400px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        padding: 20px;

        background: #090909;
        border-bottom: 1px solid #202020;

        cursor: pointer;
        position: relative;
        overflow: hidden;
    }

    .select-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        color: #888;
        text-align: center;
    }

    .select-content i {
        width: 48px;
        height: 48px;
    }

    .select-title {
        color: #fff;
        font-size: 16px;
        font-weight: 600;
    }

    .select-subtitle {
        font-size: 13px;
        color: #777;
    }

    .preview-img {
        display: none;

        width: 100%;
        max-height: 520px;

        object-fit: contain;
        border-radius: 4px;
    }

    /* CAPTION */

    .caption-box {
        padding: 18px 16px;
        border-bottom: 1px solid #202020;
    }

    .caption-label {
        font-size: 13px;
        color: #888;
        margin-bottom: 10px;
    }

    .caption-box textarea {
        width: 100%;
        min-height: 100px;

        background: transparent;
        border: none;
        outline: none;

        color: #fff;
        font-size: 15px;
        line-height: 1.5;

        resize: none;
    }

    .caption-box textarea::placeholder {
        color: #666;
    }

    .character-count {
        text-align: right;
        font-size: 12px;
        color: #666;
    }

    /* STATUS */

    .status {
        min-height: 24px;
        padding: 12px 16px;
        font-size: 13px;
        text-align: center;
    }

    .status.error {
        color: #ff5c67;
    }

    .status.success {
        color: #55d98b;
    }

    .status.loading {
        color: #aaa;
    }

    /* BOTTOM NAV */

    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);

        width: 100%;
        max-width: 600px;
        height: 64px;

        background: rgba(0, 0, 0, 0.96);
        backdrop-filter: blur(14px);

        border-top: 1px solid #202020;

        display: flex;
        align-items: center;
        justify-content: space-around;

        z-index: 500;
    }

    .nav-icon {
        width: 48px;
        height: 48px;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #aaa;
        text-decoration: none;
        border-radius: 14px;
    }

    .nav-icon.active {
        color: #fff;
    }

    .nav-icon:active {
        background: #171717;
    }

    @media (min-width: 700px) {
        body {
            background: #080808;
        }
    }
</style>
</head>

<body>

<div class="upload-container">

    <!-- HEADER -->

    <header class="upload-header">

        <button
            class="cancel-btn"
            id="cancelBtn"
        >
            Cancel
        </button>

        <h1 class="upload-title">
            New Post
        </h1>

        <button
            class="share-btn"
            id="shareBtn"
            disabled
        >
            Share
        </button>

    </header>


    <!-- IMAGE SELECTOR -->

    <div
        class="select-box"
        id="selectBox"
    >

        <div
            class="select-content"
            id="selectContent"
        >
            <i data-lucide="image-plus"></i>

            <div class="select-title">
                Select a photo
            </div>

            <div class="select-subtitle">
                Choose an image from your gallery or camera
            </div>
        </div>

        <img
            class="preview-img"
            id="postPreview"
            alt="Selected post"
        >

    </div>


    <input
        type="file"
        id="postFileInput"
        accept="image/*"
        capture="environment"
        hidden
    >


    <!-- CAPTION -->

    <div class="caption-box">

        <div class="caption-label">
            Caption
        </div>

        <textarea
            id="captionInput"
            maxlength="500"
            placeholder="Write something about your post..."
        ></textarea>

        <div
            class="character-count"
            id="characterCount"
        >
            0 / 500
        </div>

    </div>


    <!-- STATUS -->

    <div
        class="status"
        id="status"
    ></div>


    <!-- NAVIGATION -->

    <nav class="bottom-nav">

        <a
            href="feed.html"
            class="nav-icon"
            aria-label="Home"
        >
            <i data-lucide="house"></i>
        </a>

        <a
            href="search.html"
            class="nav-icon"
            aria-label="Discover"
        >
            <i data-lucide="search"></i>
        </a>

        <a
            href="upload.html"
            class="nav-icon active"
            aria-label="Create"
        >
            <i data-lucide="plus-square"></i>
        </a>

        <a
            href="reels.html"
            class="nav-icon"
            aria-label="Reels"
        >
            <i data-lucide="clapperboard"></i>
        </a>

        <a
            href="profile.html"
            class="nav-icon"
            aria-label="Profile"
        >
            <i data-lucide="user"></i>
        </a>

    </nav>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyDgOaEVjw-L7O83Wj-N7j_XQYO8RuX4sQU",
    authDomain: "code-chat-a82d0.firebaseapp.com",
    projectId: "code-chat-a82d0",
    storageBucket: "code-chat-a82d0.firebasestorage.app",
    messagingSenderId: "863595576976",
    appId: "1:863595576976:web:61217f6961e3e3a5016215"
};

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const selectBox =
    document.getElementById("selectBox");

const selectContent =
    document.getElementById("selectContent");

const fileInput =
    document.getElementById("postFileInput");

const preview =
    document.getElementById("postPreview");

const captionInput =
    document.getElementById("captionInput");

const characterCount =
    document.getElementById("characterCount");

const shareBtn =
    document.getElementById("shareBtn");

const cancelBtn =
    document.getElementById("cancelBtn");

const statusBox =
    document.getElementById("status");


/* =========================
   STATE
========================= */

let currentUser = null;

let postImageBase64 = "";


/* =========================
   ICONS
========================= */

lucide.createIcons();


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;
        }

        currentUser = user;

        updateShareButton();

    }
);


/* =========================
   SELECT IMAGE
========================= */

selectBox.addEventListener(
    "click",
    () => {

        fileInput.click();

    }
);


/* =========================
   FILE SELECTED
========================= */

fileInput.addEventListener(
    "change",
    async (event) => {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }


        if (!file.type.startsWith("image/")) {

            showStatus(
                "Please select an image.",
                "error"
            );

            return;
        }


        /*
         * Keep the image reasonably small
         * because this temporary version
         * stores it inside Firestore.
         */

        if (file.size > 8 * 1024 * 1024) {

            showStatus(
                "Image is too large. Please choose an image under 8 MB.",
                "error"
            );

            fileInput.value = "";

            return;
        }


        try {

            showStatus(
                "Preparing image...",
                "loading"
            );

            postImageBase64 =
                await compressImage(file);


            preview.src =
                postImageBase64;

            preview.style.display =
                "block";

            selectContent.style.display =
                "none";


            showStatus(
                "",
                ""
            );

            updateShareButton();

        } catch (error) {

            console.error(
                "Image processing error:",
                error
            );

            showStatus(
                "Could not process this image.",
                "error"
            );

        }

    }
);


/* =========================
   IMAGE COMPRESSION
========================= */

function compressImage(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload = (
                event
            ) => {

                const img =
                    new Image();

                img.onload = () => {

                    const maxWidth =
                        1200;

                    const scale =
                        Math.min(
                            1,
                            maxWidth /
                            img.width
                        );

                    const width =
                        Math.round(
                            img.width *
                            scale
                        );

                    const height =
                        Math.round(
                            img.height *
                            scale
                        );


                    const canvas =
                        document.createElement(
                            "canvas"
                        );

                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    const compressed =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.75
                        );


                    resolve(
                        compressed
                    );

                };


                img.onerror =
                    reject;

                img.src =
                    event.target.result;

            };


            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        }
    );
}


/* =========================
   CAPTION COUNTER
========================= */

captionInput.addEventListener(
    "input",
    () => {

        const length =
            captionInput.value.length;

        characterCount.textContent =
            `${length} / 500`;

    }
);


/* =========================
   SHARE BUTTON
========================= */

shareBtn.addEventListener(
    "click",
    sharePost
);


async function sharePost() {

    if (!currentUser) {

        showStatus(
            "Please log in first.",
            "error"
        );

        return;
    }


    if (!postImageBase64) {

        showStatus(
            "Please select an image first.",
            "error"
        );

        return;
    }


    const caption =
        captionInput.value.trim();


    try {

        shareBtn.disabled =
            true;

        shareBtn.textContent =
            "Sharing...";


        /*
         * Get current user's profile
         * from users/{uid}
         */

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );

        const userSnap =
            await getDoc(
                userRef
            );


        let username =
            currentUser.email
                ? currentUser.email
                    .split("@")[0]
                : "user";

        let avatar = "";


        if (userSnap.exists()) {

            const userData =
                userSnap.data();

            username =
                userData.username ||
                username;

            avatar =
                userData.photoURL ||
                "";

        }


        /* =====================
           CREATE POST
        ===================== */

        await addDoc(
            collection(
                db,
                "global_posts"
            ),
            {

                uid:
                    currentUser.uid,

                username:
                    username,

                avatar:
                    avatar,

                postImg:
                    postImageBase64,

                caption:
                    caption,

                likes:
                    0,

                commentsCount:
                    0,

                timestamp:
                    Date.now()

            }
        );


        showStatus(
            "Post shared successfully.",
            "success"
        );


        setTimeout(
            () => {

                window.location.href =
                    "feed.html";

            },
            700
        );


    } catch (error) {

        console.error(
            "Post upload error:",
            error
        );


        showStatus(
            getFirebaseErrorMessage(error),
            "error"
        );


        shareBtn.disabled =
            false;

        shareBtn.textContent =
            "Share";

    }

}


/* =========================
   SHARE BUTTON STATE
========================= */

function updateShareButton() {

    shareBtn.disabled =
        !currentUser ||
        !postImageBase64;

}


/* =========================
   CANCEL
========================= */

cancelBtn.addEventListener(
    "click",
    () => {

        window.location.href =
            "feed.html";

    }
);


/* =========================
   STATUS
========================= */

function showStatus(
    message,
    type
) {

    statusBox.textContent =
        message;

    statusBox.className =
        "status";

    if (type) {

        statusBox.classList.add(
            type
        );

    }

}


/* =========================
   FIREBASE ERRORS
========================= */

function getFirebaseErrorMessage(
    error
) {

    if (
        error.code ===
        "permission-denied"
    ) {

        return "Firebase permission denied. Check your Firestore rules.";

    }

    if (
        error.code ===
        "unavailable"
    ) {

        return "Internet connection problem. Please try again.";

    }

    return "Could not publish the post. Please try again.";

}

</script>

</body>
</html>
