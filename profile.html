<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - CodeChat</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
    --bg-black: #000000;
    --surface-dark: #121212;
    --border-gray: #262626;
    --ig-blue: #0095f6;
    --btn-gray: #363636;
    --text-pure: #f5f5f5;
    --text-muted: #a8a8a8;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg-black); color: var(--text-pure); min-height: 100vh; display: flex; justify-content: center; padding: 0 10px; }

.profile-wrapper { width: 100%; max-width: 480px; padding: 24px 10px; display: flex; flex-direction: column; }
.profile-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
.back-btn { background: transparent; border: none; color: white; cursor: pointer; }
.profile-header h2 { font-size: 20px; font-weight: 700; }

.account-overview { display: flex; align-items: center; gap: 25px; margin-bottom: 20px; }
.avatar-container { position: relative; width: 86px; height: 86px; cursor: pointer; }
.avatar-large { width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, #4f46e5, #06b6d4); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; color: white; object-fit: cover; border: 2px solid var(--border-gray); }
.avatar-overlay { position: absolute; bottom: 0; right: 0; background: var(--ig-blue); border: 2px solid black; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; }

.stats-counter-grid { flex: 1; display: flex; justify-content: space-around; text-align: center; }
.stat-box data { font-size: 18px; font-weight: 700; color: white; display: block; }
.stat-box span { font-size: 12px; color: var(--text-muted); }

.user-details-section { margin-bottom: 20px; text-align: left; }
.user-details-section h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.user-email { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
.bio-text { font-size: 14px; color: #dbdbdb; line-height: 1.4; white-space: pre-line; }

.bio-edit-container { display: none; margin-top: 10px; flex-direction: column; gap: 10px; }
.bio-edit-container textarea { background: var(--surface-dark); border: 1px solid var(--border-gray); border-radius: 8px; padding: 10px; color: white; font-size: 14px; outline: none; resize: none; }

.action-buttons-group { display: flex; flex-direction: column; gap: 10px; }
.btn-primary { width: 100%; padding: 11px; border: none; border-radius: 10px; background: var(--ig-blue); color: white; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-secondary { width: 100%; padding: 11px; border: 1px solid var(--border-gray); border-radius: 10px; background: var(--btn-gray); color: white; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-save { background: #00f59b; color: #000; }
</style>
</head>
<body>

<div class="profile-wrapper">
    <header class="profile-header">
        <button class="back-btn" onclick="location.href='search.html'"><i data-lucide="arrow-left"></i></button>
        <h2 id="topNavUsername">profile</h2>
        <div style="width:24px;"></div>
    </header>

    <section class="account-overview">
        <div class="avatar-container" onclick="triggerProfilePicUpload()">
            <div id="avatarHolder">
                <div class="avatar-large" id="profileAvatar">U</div>
            </div>
            <div class="avatar-overlay">
                <i data-lucide="camera" style="width:14px; color:white;"></i>
            </div>
        </div>
        <input type="file" id="profileFileInput" accept="image/*" style="display: none;" onchange="uploadProfilePic(event)">

        <div class="stats-counter-grid">
            <div class="stat-box"><data id="countPosts">12</data><span>Posts</span></div>
            <div class="stat-box"><data id="countFollowers">1.4K</data><span>Followers</span></div>
            <div class="stat-box"><data id="countFollowing">382</data><span>Following</span></div>
        </div>
    </section>

    <section class="user-details-section">
        <h3 id="displayUsername">Loading...</h3>
        <div class="user-email" id="displayEmail">📧 loading...</div>
        <p class="bio-text" id="displayBio">Click 'Edit Profile' to customize your bio! ✨</p>
        
        <div class="bio-edit-container" id="bioEditBox">
            <textarea id="bioInput" rows="3" placeholder="Write something cool about yourself..."></textarea>
            <button class="btn-primary btn-save" onclick="saveProfileData()">Save Profile</button>
        </div>
    </section>

    <footer class="action-buttons-group">
        <button class="btn-secondary" onclick="toggleBioEditor()"><i data-lucide="edit-3" style="width:16px;"></i> Edit Profile</button>
        <button class="btn-primary" onclick="location.href='search.html'"><i data-lucide="message-circle" style="width:16px;"></i> Back to Messages</button>
    </footer>
</div>

<script>
lucide.createIcons();

const userEmail = localStorage.getItem("email") || "user@codechat.com";
const calculatedUsername = userEmail.split("@")[0];
let currentSavedBio = localStorage.getItem("userBio") || "Hey there! I am using CodeChat. 🚀";
let currentSavedAvatar = localStorage.getItem("userAvatar") || "";

document.getElementById("displayEmail").innerHTML = `📧 ${userEmail}`;
document.getElementById("displayUsername").innerText = calculatedUsername;
document.getElementById("topNavUsername").innerText = calculatedUsername.toLowerCase();
document.getElementById("displayBio").innerText = currentSavedBio;

function renderAvatar() {
    const avatarHolder = document.getElementById("avatarHolder");
    if (currentSavedAvatar && currentSavedAvatar.trim() !== "") {
        avatarHolder.innerHTML = `<img src="${currentSavedAvatar}" class="avatar-large" id="profileAvatar" onerror="resetAvatarImg()">`;
    } else {
        avatarHolder.innerHTML = `<div class="avatar-large" id="profileAvatar">${calculatedUsername.charAt(0).toUpperCase()}</div>`;
    }
}

window.resetAvatarImg = function() {
    localStorage.removeItem("userAvatar");
    currentSavedAvatar = "";
    renderAvatar();
};

// Functions for File & Camera Handling
window.triggerProfilePicUpload = function() {
    document.getElementById("profileFileInput").click();
};

window.uploadProfilePic = function(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            currentSavedAvatar = e.target.result;
            localStorage.setItem("userAvatar", currentSavedAvatar); // Saves photo raw data
            renderAvatar();
        };
        reader.readAsDataURL(file);
    }
};

renderAvatar();

window.toggleBioEditor = function() {
    const editBox = document.getElementById("bioEditBox");
    const bioText = document.getElementById("displayBio");
    const inputField = document.getElementById("bioInput");

    if (editBox.style.display === "flex") {
        editBox.style.display = "none";
        bioText.style.display = "block";
    } else {
        editBox.style.display = "flex";
        bioText.style.display = "none";
        inputField.value = currentSavedBio;
        inputField.focus();
    }
};

window.saveProfileData = function() {
    const newBio = document.getElementById("bioInput").value.trim();
    if (newBio !== "") {
        currentSavedBio = newBio;
        localStorage.setItem("userBio", newBio);
        document.getElementById("displayBio").innerText = newBio;
    }
    toggleBioEditor();
};
</script>
</body>
</html>
