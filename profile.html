<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title><style>
body{
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:20px;
text-align:center;
}

.profile-card{
background:#1e293b;
padding:25px;
border-radius:15px;
max-width:400px;
margin:auto;
margin-top:40px;
}

.avatar{
width:100px;
height:100px;
border-radius:50%;
background:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
margin:auto;
margin-bottom:20px;
}

.info{
background:#0f172a;
padding:12px;
border-radius:10px;
margin-top:10px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
}
</style></head><body><div class="profile-card"><div class="avatar">
👤
</div><h2 id="username">Loading...</h2><div class="info" id="email">
Loading Email...
</div><button onclick="location.href='chat.html'">
💬 Back To Chat
</button></div><script>

const email =
localStorage.getItem("email") || "Not Found";

document.getElementById("email").innerHTML =
"📧 " + email;

const username =
email.split("@")[0];

document.getElementById("username").innerHTML =
username;

</script></body>
</html>
